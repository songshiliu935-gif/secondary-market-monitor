name: Update Market Book

on:
  workflow_dispatch:
  schedule:
    # 08:30 Sydney time, Tuesday to Saturday.
    # This covers Monday-Friday US market closes.
    - cron: "30 8 * * 2-6"
      timezone: "Australia/Sydney"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-market-book:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update market data
        run: python update_market_book.py --brief-dir briefs

      - name: Commit updated market book
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/market_book.json briefs

          if git diff --cached --quiet; then
            echo "No market data changes."
          else
            git commit -m "Update daily market book"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
